[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bronze-schema-drift"
version = "0.1.0"
description = "A local Delta Lake demo for handling source schema drift"
requires-python = ">=3.10"
dependencies = [
    "deltalake==1.6.6",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
